name: Blue/Green Deployment

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy to (blue or green)'
        required: true
        default: 'green'
        type: choice
        options: [blue, green]

env:
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/inventory-frontend
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/inventory-backend

jobs:
  blue-green-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images
        run: |
          docker build -t ${{ env.FRONTEND_IMAGE }}:${{ github.event.inputs.target }} .
          docker build -t ${{ env.BACKEND_IMAGE }}:${{ github.event.inputs.target }} ./backend
          docker push ${{ env.FRONTEND_IMAGE }}:${{ github.event.inputs.target }}
          docker push ${{ env.BACKEND_IMAGE }}:${{ github.event.inputs.target }}

      - name: Deploy to target environment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /app
            chmod +x scripts/blue-green.sh
            bash scripts/blue-green.sh ${{ github.event.inputs.target }} \
              ${{ secrets.DOCKERHUB_USERNAME }} \
              ${{ secrets.DB_PASSWORD }}
