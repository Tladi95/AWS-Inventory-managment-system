name: CI/CD Pipeline

on:
  push:
    branches: [main]

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/inventory-frontend
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/inventory-backend
  AWS_REGION: af-south-1
  ASG_NAME: ims-asg

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest,${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest,${{ env.BACKEND_IMAGE }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      id-token: write   # required for OIDC — no access keys anywhere in this repo
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC token claims
        run: |
          curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r .value | cut -d. -f2 | base64 -d 2>/dev/null | jq .

      - name: Configure AWS credentials (OIDC — no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Session Manager plugin
        run: |
          curl -s "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o session-manager-plugin.deb
          sudo dpkg -i session-manager-plugin.deb

      - name: Write deploy key
        run: |
          umask 077
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh-keygen -y -f /tmp/deploy_key > /tmp/deploy_key.pub

      - name: Discover running instance(s) in the ASG
        id: instances
        run: |
          IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-name "${{ env.ASG_NAME }}" \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
            --output text)

          if [ -z "$IDS" ]; then
            echo "No InService instances found in ASG ${{ env.ASG_NAME }}. Check desired_capacity." >&2
            exit 1
          fi

          echo "instance_ids=$IDS" >> "$GITHUB_OUTPUT"
          echo "Found instances: $IDS"

      - name: Deploy to each instance
        run: |
          for INSTANCE_ID in ${{ steps.instances.outputs.instance_ids }}; do
            echo "=== Deploying to $INSTANCE_ID ==="

            aws ec2-instance-connect send-ssh-public-key \
              --region "${{ env.AWS_REGION }}" \
              --instance-id "$INSTANCE_ID" \
              --instance-os-user "${{ secrets.EC2_USER }}" \
              --ssh-public-key file:///tmp/deploy_key.pub

            ssh -o StrictHostKeyChecking=no \
                -o ProxyCommand="aws ec2-instance-connect open-tunnel --instance-id %h --region ${{ env.AWS_REGION }}" \
                -i /tmp/deploy_key \
                "${{ secrets.EC2_USER }}@$INSTANCE_ID" \
                "sudo mkdir -p /app/nginx && sudo chown -R ${{ secrets.EC2_USER }}:${{ secrets.EC2_USER }} /app && which docker || sudo dnf install -y docker && sudo systemctl enable --now docker && sudo usermod -aG docker ${{ secrets.EC2_USER }}"

            scp -o StrictHostKeyChecking=no \
                -o ProxyCommand="aws ec2-instance-connect open-tunnel --instance-id %h --region ${{ env.AWS_REGION }}" \
                -i /tmp/deploy_key \
                docker-compose.yaml \
                "${{ secrets.EC2_USER }}@$INSTANCE_ID:/app/docker-compose.yaml"

            scp -o StrictHostKeyChecking=no \
                -o ProxyCommand="aws ec2-instance-connect open-tunnel --instance-id %h --region ${{ env.AWS_REGION }}" \
                -i /tmp/deploy_key \
                nginx/default.conf \
                "${{ secrets.EC2_USER }}@$INSTANCE_ID:/app/nginx/default.conf"

            ssh -o StrictHostKeyChecking=no \
                -o ProxyCommand="aws ec2-instance-connect open-tunnel --instance-id %h --region ${{ env.AWS_REGION }}" \
                -i /tmp/deploy_key \
                "${{ secrets.EC2_USER }}@$INSTANCE_ID" \
                "cd /app && \
                 export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} && \
                 export DB_PASSWORD=\$(aws ssm get-parameter --name /ims/db_password --with-decryption --query Parameter.Value --output text --region ${{ env.AWS_REGION }}) && \
                 export RDS_ENDPOINT=\$(aws ssm get-parameter --name /ims/rds_endpoint --query Parameter.Value --output text --region ${{ env.AWS_REGION }}) && \
                 docker pull ${{ env.FRONTEND_IMAGE }}:latest && \
                 docker pull ${{ env.BACKEND_IMAGE }}:latest && \
                 docker compose down && \
                 docker compose up -d && \
                 docker image prune -f"
          done

      - name: Clean up key
        if: always()
        run: rm -f /tmp/deploy_key /tmp/deploy_key.pub