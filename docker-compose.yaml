version: '3.9'

services:

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

  frontend:
    image: ${DOCKERHUB_USERNAME}/inventory-frontend:latest
    container_name: frontend
    expose:
      - "5173"

  backend:
    image: ${DOCKERHUB_USERNAME}/inventory-backend:latest
    container_name: backend
    expose:
      - "3001"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@${RDS_ENDPOINT}/inventory
      NODE_ENV: production
